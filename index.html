<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuInk</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#F9F7F2;
    color:#2D2D2D;
}

/* HEADER */
header {
    background:#8E9AAF;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
    flex-wrap:wrap;
}

header h1 {
    margin:5px 0;
}

header a {
    color:white;
    margin-left:10px;
    text-decoration:none;
}

/* BUSCADOR */
.search-header {
    width:100%;
    text-align:center;
    margin-top:10px;
}

.search-header input {
    width:60%;
    max-width:350px;
    padding:10px;
    border-radius:25px;
    border:none;
}

/* HERO */
.hero {
    height:260px;
    position:relative;
    overflow:hidden;
}

.slide {
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1s;
}

.slide.active {
    opacity:1;
}

.overlay {
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    background:rgba(0,0,0,0.4);
    color:white;
    text-align:center;
    padding:10px;
}

.overlay h1 {
    font-size:22px;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:15px;
}

.card {
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.card img {
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h3 {
    font-size:14px;
    padding:8px;
}

.btn {
    margin:8px;
    padding:6px;
    background:#B78D8D;
    color:white;
    border:none;
    border-radius:8px;
    width:calc(100% - 16px);
}

/* FOOTER */
footer {
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    padding:20px;
    background:#8E9AAF;
    color:white;
}

.contact-banner {
    background:#6C7A89;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.contact-banner ul {
    list-style:none;
    padding:0;
    margin:0;
}

.contact-banner li {
    margin:5px 0;
}

/* MODAL */
.modal {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(142,154,175,0.9);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal.hidden {
    display:none;
}

.modal-content {
    background:#F9F7F2;
    padding:20px;
    border-radius:15px;
    max-width:90%;
    text-align:center;
}

.modal-buttons {
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:15px;
}

.btn-yes, .btn-no {
    padding:10px;
    border:none;
    border-radius:10px;
    color:white;
}

.btn-yes { background:#8E9AAF; }
.btn-no { background:#B78D8D; }

/* 📱 MEDIA QUERY */
@media (min-width:768px) {
    .search-header input {
        width:320px;
    }

    .modal-buttons {
        flex-direction:row;
    }

    .card img {
        height:320px;
    }
}
</style>
</head>

<body>

<!-- MODAL -->
<div id="ageModal" class="modal hidden">
    <div class="modal-content">
        <h2>Bienvenidos a MizuInk</h2>
        <p>Contenido BL +18. Confirma que eres mayor de edad.</p>

        <div class="modal-buttons">
            <button onclick="aceptarEdad()" class="btn-yes">Sí, soy mayor</button>
            <button onclick="salirPagina()" class="btn-no">Salir</button>
        </div>
    </div>
</div>

<header>
    <h1>MizuInk</h1>

    <div>
        <a href="#">Login</a>
        <a href="#">Registro</a>
    </div>

    <div class="search-header">
        <input type="text" placeholder="Buscar manga...">
    </div>
</header>

<section class="hero">
    <div class="slide active" style="background-image:url('Jinx.jpg')"></div>
    <div class="overlay">
        <h1>Descubre mangas BL</h1>
    </div>
</section>

<section class="section">
<h2>🔥 Populares</h2>
<div class="grid">
<div class="card"><img src="Jinx.jpg"><h3>Jinx</h3><button class="btn">Leer</button></div>
<div class="card"><img src="Painter.jpg"><h3>Painter</h3><button class="btn">Leer</button></div>
</div>
</section>

<footer>
    <p>MizuInk © 2026</p>

    <div class="contact-banner">
        <ul>
            <li>📧 Correo</li>
            <li>📱 Telegram</li>
            <li>💬 Discord</li>
        </ul>
    </div>
</footer>

<script>
// MODAL
document.addEventListener("DOMContentLoaded", () => {
    const modal = document.getElementById("ageModal");

    if(localStorage.getItem("edadAceptada") === "true") {
        modal.classList.add("hidden");
    } else {
        modal.classList.remove("hidden");
        document.body.style.overflow = "hidden";
    }
});

function aceptarEdad() {
    localStorage.setItem("edadAceptada", "true");
    document.getElementById("ageModal").classList.add("hidden");
    document.body.style.overflow = "auto";
}

function salirPagina() {
    window.location.href = "https://www.google.com";
}
</script>

</body>
</html>
