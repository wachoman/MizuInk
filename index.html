<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuInk</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#F9F7F2,#E5D3B3);
}
header {
    background:#8E9AAF;
    padding:15px;
    display:flex;
    justify-content:space-between;
    color:white;
}
.container {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    padding:20px;
}
.card {
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.card img { width:100%; }
.card h3 { padding:10px; }
.btn {
    background:#B78D8D;
    border:none;
    color:white;
    padding:10px;
    margin:10px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>MizuInk</h1>
    <div>
        <a href="login.html">Login</a>
        <a href="registro.html">Registro</a>
    </div>
</header>

<div class="container" id="mangas">

    <!-- ===================== MANGAS MANUALES (TEMPORAL) ===================== -->
    <!-- Puedes copiar este bloque para agregar mangas mientras no usas Firebase -->

    <div class="card">
        <img src="https://via.placeholder.com/200x300">
        <h3>Manga de ejemplo</h3>
        <button class="btn">Seguir</button>
    </div>

</div>
