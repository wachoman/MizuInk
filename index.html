<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuInk</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#F9F7F2;
    color:#2D2D2D;
}

/* HEADER */
header {
    background:#8E9AAF;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
}

header a {
    color:white;
    margin-left:15px;
    text-decoration:none;
}

/* BUSCADOR */
.search-header input {
    width:320px;
    padding:10px 15px;
    border-radius:25px;
    border:none;
    font-size:15px;
}

/* HERO */
.hero {
    position: relative;
    height: 320px;
    overflow: hidden;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1s ease-in-out;
}

.slide.active {
    opacity: 1;
}

.overlay {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    background: rgba(0,0,0,0.4);
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:20px;
}

.card {
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img {
    width:100%;
    height:320px;
    object-fit:cover;
}

/* FOOTER */
footer {
    display:flex;
    justify-content:space-between;
    padding:25px;
    background:#8E9AAF;
    color:white;
}

/* CONTACTO */
.contact-banner {
    background:#6C7A89;
    padding:15px;
    border-radius:12px;
}

/* MODAL */
.modal {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(142,154,175,0.9);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal.hidden {
    display:none;
}

.modal-content {
    background:#F9F7F2;
    padding:30px;
    border-radius:20px;
    max-width:520px;
    text-align:center;
    border:2px solid #8E9AAF;
}

.modal-buttons {
    margin-top:20px;
    display:flex;
    gap:10px;
}

.btn-yes {
    flex:1;
    background:#8E9AAF;
    color:white;
    border:none;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.btn-no {
    flex:1;
    background:#B78D8D;
    color:white;
    border:none;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- MODAL -->
<div id="ageModal" class="modal hidden">
    <div class="modal-content">
        <h2>⚠️ Bienvenidos a MizuInk</h2>
        <p>Somos un espacio dedicado a la difusión y apreciación del género Boys' Love.</p>
        <p><strong>ADVERTENCIA:</strong> Contenido +18.</p>

        <div class="modal-buttons">
            <button onclick="aceptarEdad()" class="btn-yes">Sí, soy mayor de edad</button>
            <button onclick="salirPagina()" class="btn-no">No, salir</button>
        </div>
    </div>
</div>

<header>
    <h1>MizuInk</h1>
    <div class="search-header">
        <input type="text" placeholder="Buscar manga...">
    </div>
</header>

<section class="hero">
    <div class="slide active" style="background-image:url('Jinx.jpg')"></div>
</section>

<footer>
    <p>MizuInk © 2026</p>
    <div class="contact-banner">Contacto</div>
</footer>

<script>
// CONTROL MODAL CORREGIDO
document.addEventListener("DOMContentLoaded", () => {
    const modal = document.getElementById("ageModal");

    if(localStorage.getItem("edadAceptada") === "true") {
        modal.classList.add("hidden");
    } else {
        modal.classList.remove("hidden");
        document.body.style.overflow = "hidden";
    }
});

function aceptarEdad() {
    localStorage.setItem("edadAceptada", "true");
    document.getElementById("ageModal").classList.add("hidden");
    document.body.style.overflow = "auto";
}

function salirPagina() {
    window.location.href = "https://www.google.com";
}
</script>

</body>
</html>
