<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuInk</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#F9F7F2;
    color:#2D2D2D;
}

/* HEADER */
header {
    background:#8E9AAF;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
}

header a {
    color:white;
    margin-left:15px;
    text-decoration:none;
}

/* HERO (CARRUSEL) */
.hero {
    position: relative;
    height: 320px;
    overflow: hidden;
}

/* SLIDES */
.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1s ease-in-out;
}

.slide.active {
    opacity: 1;
}

/* TEXTO ENCIMA */
.overlay {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    background: rgba(0,0,0,0.4);
}

.overlay h1 {
    font-size: 38px;
}

/* BUSCADOR */
.search {
    text-align:center;
    margin:20px;
}

.search input {
    width:60%;
    padding:12px;
    border-radius:25px;
    border:1px solid #ccc;
}

/* SECCIONES */
.section {
    padding:20px;
}

.section h2 {
    margin-bottom:15px;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:20px;
}

/* CARD */
.card {
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
    cursor:pointer;
}

.card:hover {
    transform:translateY(-10px);
}

.card img {
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h3 {
    padding:10px;
    font-size:16px;
}

/* BOTON */
.btn {
    margin:10px;
    padding:8px;
    background:#B78D8D;
    border:none;
    color:white;
    border-radius:8px;
    width:calc(100% - 20px);
}

/* FOOTER */
footer {
    text-align:center;
    padding:15px;
    background:#8E9AAF;
    color:white;
}
</style>

</head>
<body>

<header>
    <h1>MizuInk</h1>
    <div>
        <a href="login.html">Login</a>
        <a href="registro.html">Registro</a>
    </div>
</header>

<!-- HERO CARRUSEL -->
<section class="hero">

    <div class="slide active" style="background-image:url('Jinx.jpg')"></div>
    <div class="slide" style="background-image:url('Painter.jpg')"></div>
    <div class="slide" style="background-image:url('Love.jpg')"></div>
    <div class="slide" style="background-image:url('Error.jpg')"></div>

    <div class="overlay">
        <h1>Descubre los mejores mangas BL / Yaoi</h1>
    </div>

</section>

<!-- BUSCADOR -->
<div class="search">
    <input type="text" placeholder="Buscar manga...">
</div>

<!-- POPULARES -->
<section class="section">
<h2>🔥 Populares</h2>

<div class="grid">

<div class="card">
    <img src="Jinx.jpg">
    <h3>Jinx</h3>
    <button class="btn">Leer</button>
</div>

<div class="card">
    <img src="Painter.jpg">
    <h3>Painter of the Night</h3>
    <button class="btn">Leer</button>
</div>

<div class="card">
    <img src="Love.jpg">
    <h3>Love is an Illusion</h3>
    <button class="btn">Leer</button>
</div>

<div class="card">
    <img src="Error.jpg">
    <h3>Semantic Error</h3>
    <button class="btn">Leer</button>
</div>

</div>
</section>

<!-- NUEVOS -->
<section class="section">
<h2>🆕 Nuevos</h2>

<div class="grid">

<div class="card">
    <img src="Jujutsu.jpg">
    <h3>Jujutsu Kaisen</h3>
    <button class="btn">Leer</button>
</div>

<div class="card">
    <img src="Jojo.jpg">
    <h3>Jojo's Bizarre Adventure</h3>
    <button class="btn">Leer</button>
</div>

<div class="card">
    <img src="One.jpg">
    <h3>One Piece</h3>
    <button class="btn">Leer</button>
</div>

</div>
</section>

<footer>
    <p>MizuInk © 2026</p>
</footer>

<!-- SCRIPT CARRUSEL -->
<script>
let slides = document.querySelectorAll(".slide");
let index = 0;

function cambiarSlide() {
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}

setInterval(cambiarSlide, 3000);
</script>

</body>
</html>
