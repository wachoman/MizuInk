<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuInk</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #F9F7F2, #E5D3B3);
}
header {
    background: #8E9AAF;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    color: white;
}
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 20px;
    padding: 20px;
}
.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
}
.card img { width:100%; }
.btn {
    background:#B78D8D;
    border:none;
    color:white;
    padding:10px;
    margin:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<header>
    <h1>MizuInk</h1>
    <div>
        <a href="login.html">Login</a>
        <a href="registro.html">Registro</a>
    </div>
</header>

<div class="container" id="mangas"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = { /* TU CONFIG */ };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Cargar mangas
async function cargarMangas() {
    const cont = document.getElementById("mangas");
    const data = await getDocs(collection(db, "mangas"));

    data.forEach(doc => {
        const m = doc.data();
        cont.innerHTML += `
        <div class="card">
            <img src="${m.imagen}">
            <h3>${m.nombre}</h3>
            <button class="btn">Seguir</button>
        </div>`;
    });
}

cargarMangas();

// Detectar admin
onAuthStateChanged(auth, async (user) => {
    if(user){
        const res = await getDocs(collection(db, "usuarios"));
        res.forEach(doc=>{
            const u = doc.data();
            if(u.uid === user.uid && u.role === "admin"){
                // Redirección secreta
                window.location.href = "admin.html";
            }
        });
    }
});
</script>

</body>
</html>
