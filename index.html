<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuInk</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #F9F7F2;
        color: #2D2D2D;
    }

    header {
        background-color: #8E9AAF;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
    }

    header h1 {
        margin: 0;
    }

    nav a {
        margin: 5px 10px;
        text-decoration: none;
        color: #2D2D2D;
        font-weight: bold;
    }

    .search-bar {
        text-align: center;
        margin: 20px;
    }

    .search-bar input {
        width: 80%;
        max-width: 500px;
        padding: 10px;
        border: 2px solid #E5D3B3;
        border-radius: 10px;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        padding: 20px;
    }

    .card {
        background: white;
        border: 2px solid #E5D3B3;
        border-radius: 15px;
        padding: 10px;
        text-align: center;
        transition: transform 0.2s;
    }

    .card:hover {
        transform: scale(1.05);
    }

    .card img {
        width: 100%;
        border-radius: 10px;
    }

    .btn {
        background-color: #B78D8D;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
    }

    footer {
        text-align: center;
        padding: 10px;
        background-color: #8E9AAF;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
        header {
            flex-direction: column;
            align-items: flex-start;
        }

        .search-bar input {
            width: 95%;
        }
    }
</style>
</head>
<body>

<header>
    <h1>MizuInk</h1>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="registro.html">Registro</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="search-bar">
    <input type="text" placeholder="Buscar manga...">
</div>

<section class="container">
    <div class="card">
        <img src="https://via.placeholder.com/200x300" alt="manga">
        <h3>Manga 1</h3>
        <button class="btn">Seguir</button>
    </div>
    <div class="card">
        <img src="https://via.placeholder.com/200x300" alt="manga">
        <h3>Manga 2</h3>
        <button class="btn">Seguir</button>
    </div>
</section>

<!-- ESPACIO PARA CONEXIÓN A BASE DE DATOS -->
<script>
// Aquí irá la lógica para conectar usuarios, mangas y favoritos
</script>

<footer>
    <p>MizuInk © 2026</p>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background-color: #F9F7F2;
}
.form-container {
    max-width: 400px;

    padding: 20px;

}
input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}
button {
    width: 100%;
    padding: 10px;
    background-color: #B78D8D;
    color: white;
    border: none;
}
</style>
</head>
<body>
<div class="form-container">
    <h2>Login</h2>
    <input type="text" placeholder="Usuario">

    <button>Ingresar</button>
</div>
</body>
</html>
