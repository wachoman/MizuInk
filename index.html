<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MizuInk</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#F9F7F2;
    color:#2D2D2D;
}

/* HEADER */
header {
    background:#8E9AAF;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    color:white;
}

.search-header {
    flex:1;
    display:flex;
    justify-content:center;
}

.search-header input {
    width:100%;
    max-width:350px;
    padding:8px 12px;
    border-radius:25px;
    border:none;
}

.nav-links {
    display:flex;
    gap:10px;
}

header a {
    color:white;
    text-decoration:none;
}

/* HERO */
.hero {
    height:300px;
    position:relative;
    overflow:hidden;
}

.slide {
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:1s;
}

.slide.active { opacity:1; }

.overlay {
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    background:rgba(0,0,0,0.4);
    color:white;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
}

/* FOOTER */
footer {
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:25px;
    background:#8E9AAF;
    color:white;
}

/* CONTACTO CENTRADO Y ESTILIZADO */
.contact-banner {
    margin-top:15px;
    background:#6C7A89;
    padding:20px;
    border-radius:15px;
    width:100%;
    max-width:400px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.contact-banner ul {
    list-style:none;
    padding:0;
    margin:0;
}

.contact-banner li {
    margin:15px 0;
}

/* LINKS SIN SUBRAYADO */
.contact-banner a {
    color:white;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
    display:block;
    transition:0.3s;
}

/* HOVER BONITO */
.contact-banner a:hover {
    color:#FFDADA;
    transform:scale(1.05);
}

/* DESCRIPCION */
.contact-banner span {
    display:block;
    font-size:13px;
    margin-top:5px;
    opacity:0.9;
}

/* RESPONSIVE */
@media (max-width:768px) {
    header {
        flex-wrap:wrap;
        justify-content:center;
    }

    .search-header {
        order:3;
        width:100%;
        margin-top:10px;
    }

    .nav-links {
        order:2;
    }
}
</style>
</head>

<body>

<header>
    <h1>MizuInk</h1>

    <div class="search-header">
        <input type="text" placeholder="Buscar manga...">
    </div>

    <div class="nav-links">
        <a href="#">Login</a>
        <a href="#">Registro</a>
    </div>
</header>

<section class="hero">
    <div class="slide active" style="background-image:url('Jinx.jpg')"></div>
    <div class="overlay">
        <h1>Descubre mangas BL</h1>
    </div>
</section>

<footer>
    <p>MizuInk © 2026</p>

    <div class="contact-banner">
        <ul>
            <li>
                <a href="mailto:tucorreo@gmail.com">📧 ¡Contáctanos!</a>
                <span>Envíanos un correo para dudas o sugerencias</span>
            </li>

            <li>
                <a href="https://t.me/tuusuario">📱 Telegram</a>
                <span>Entérate de las actualizaciones de tus mangas favoritos</span>
            </li>

            <li>
                <a href="https://discord.gg/tulink">💬 Discord</a>
                <span>Únete a nuestro servidor de Discord para escuchar tus peticiones</span>
            </li>
        </ul>
    </div>
</footer>

</body>
</html>
