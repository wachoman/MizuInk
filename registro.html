<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - MizuInk</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#B78D8D,#8E9AAF);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* TARJETA */
.card {
    background:#F9F7F2;
    padding:40px;
    border-radius:20px;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

/* TITULO */
h2 {
    margin-bottom:20px;
}

/* INPUTS */
.input-group {
    margin:20px 0;
}

input {
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #E5D3B3;
    outline:none;
}

/* BOTON */
button {
    width:100%;
    padding:12px;
    background:#8E9AAF;
    border:none;
    color:white;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover {
    background:#6f7c92;
}

/* LINK */
.link {
    margin-top:15px;
    font-size:14px;
}

.link a {
    color:#B78D8D;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="card">
    <h2>Crear cuenta</h2>

    <div class="input-group">
        <input placeholder="Correo electrónico">
    </div>

    <div class="input-group">
        <input type="password" placeholder="Contraseña">
    </div>

    <button>Registrarse</button>

    <div class="link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </div>
</div>

<!-- FIREBASE AQUÍ -->

</body>
</html>
