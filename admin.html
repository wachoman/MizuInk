<h2>Panel Admin</h2>

<input id="nombre" placeholder="Nombre manga">
<input id="imagen" placeholder="URL imagen">
<button onclick="agregar()">Agregar</button>

<div id="lista"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = initializeApp({ /* config */ });
const db = getFirestore(app);
const auth = getAuth(app);

// PROTECCIÓN ADMIN
onAuthStateChanged(auth, async (user) => {
    if(!user) return location.href = "login.html";

    const users = await getDocs(collection(db, "usuarios"));
    let isAdmin = false;

    users.forEach(doc=>{
        const u = doc.data();
        if(u.uid === user.uid && u.role === "admin"){
            isAdmin = true;
        }
    });

    if(!isAdmin){
        alert("No autorizado");
        location.href = "index.html";
    }
});

// CRUD
window.agregar = async () => {
    await addDoc(collection(db,"mangas"), {
        nombre: nombre.value,
        imagen: imagen.value
    });
    cargar();
};

async function cargar(){
    const cont = document.getElementById("lista");
    cont.innerHTML = "";

    const data = await getDocs(collection(db,"mangas"));

    data.forEach(d=>{
        const m = d.data();
        cont.innerHTML += `
        <div>
            ${m.nombre}
            <button onclick="eliminar('${d.id}')">X</button>
        </div>`;
    });
}

window.eliminar = async (id)=>{
    await deleteDoc(doc(db,"mangas",id));
    cargar();
};

cargar();
</script>
