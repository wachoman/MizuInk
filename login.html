<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MizuInk</title>
<style>
body {
    font-family: Arial;
    background-color: #F9F7F2;
}
.form-container {
    max-width: 400px;
    margin: 80px auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid #E5D3B3;
}
input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}
button {
    width: 100%;
    padding: 10px;
    background-color: #B78D8D;
    color: white;
    border: none;
}
</style>
</head>
<body>
<div class="form-container">
    <h2>Login</h2>
    <input type="text" placeholder="Usuario">
    <input type="password" placeholder="Contraseña">
    <button>Ingresar</button>
</div>
</body>
</html>
