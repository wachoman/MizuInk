<!-- ===================== LOGIN.HTML ===================== -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body {background: linear-gradient(135deg,#F9F7F2,#B78D8D); font-family:sans-serif;}
.form {max-width:400px;margin:100px auto;background:white;padding:30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,0.2);} 
input{width:100%;padding:10px;margin:10px 0;border-radius:10px;border:1px solid #ccc;}
button{width:100%;padding:10px;background:#8E9AAF;color:white;border:none;border-radius:10px;}
</style>
</head>
<body>
<div class="form">
<h2>Login</h2>
<input type="text" placeholder="Usuario">
<input type="password" placeholder="Contraseña">
<button>Entrar</button>
</div>
</body>
</html>
